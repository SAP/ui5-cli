version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  reviewers:
  - "SAP/ui5-foundation"
  versioning-strategy: increase
  commit-message:
    prefix: "[DEPENDENCY] "
    prefix-development: "[INTERNAL] "
  cooldown:
    default-days: 2
  ignore:
    - dependency-name: "eslint-plugin-ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "eslint"
      update-types: ["version-update:semver-major"]
